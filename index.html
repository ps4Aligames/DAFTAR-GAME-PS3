function h(s){let a=0;for(let i=0;i<s.length;i++)a=s.charCodeAt(i)+((a<<5)-a);return Math.abs(a)%360;}
function renderChips(){const c=document.getElementById('chips');c.innerHTML='';GENRES.forEach(g=>{const cnt=g==='Semua'?GAMES.length:GAMES.filter(x=>x.genre===g).length;const b=document.createElement('button');b.className='chip'+(active===g?' on':'');b.textContent=g+' ('+cnt+')';b.onclick=()=>{active=g;renderChips();render();};c.appendChild(b);});}
function coverHtml(g){const codeRaw=g.code||'';const codeClean=codeRaw.replace(/[^A-Za-z0-9]/g,'');const variants=[`covers/${codeRaw}.jpg`,`covers/${codeClean}.jpg`];let hue=h(g.title);let grad=`linear-gradient(135deg,hsl(${hue} 70% 45%),hsl(${(hue+40)%360} 60% 25%))`;let imgs=variants.map(v=>`<img src="${v}" onerror="this.remove()" loading="lazy">`).join('');return `<div class="cover" style="background:${grad}">${imgs}</div>`;}
function render(){const q=document.getElementById('q').value.toLowerCase();const grid=document.getElementById('grid');grid.innerHTML='';let list=GAMES;if(active!=='Semua')list=list.filter(x=>x.genre===active);if(q)list=list.filter(x=>(x.title+x.code).toLowerCase().includes(q));list.forEach(g=>{const idx=GAMES.indexOf(g);const on=sel.has(idx);const card=document.createElement('div');card.className='card'+(on?' on':'');card.onclick=()=>{if(sel.has(idx))sel.delete(idx);else sel.add(idx);render();};card.innerHTML=coverHtml(g)+'<div class="foot"><div class="ft">'+g.title+'</div><div class="fc">'+g.code+' • '+g.genre+'</div></div>';grid.appendChild(card);});document.getElementById('cnt').textContent=sel.size+' dipilih';}
function grouped(){const m={};Array.from(sel).forEach(i=>{const g=GAMES[i];if(!m[g.genre])m[g.genre]=[];m[g.genre].push(g);});return m;}
function make(){const cust=document.getElementById('cust').value||'Kak';const map=grouped();let txt='';Object.keys(map).forEach(gr=>{txt+='['+gr+']\n';map[gr].forEach((g,i)=>{txt+=(i+1)+'. '+g.title+' - '+g.code+'\n';});txt+='\n';});return 'Halo Ali Games, order PS3:\n'+txt+'Total: '+sel.size+' game\nNama: '+cust;}
function wa(){const msg=make();window.open('https://wa.me/62895708629977?text='+encodeURIComponent(msg),'_blank');}
function send(){wa();}
renderChips();render();
</script></body></html>
