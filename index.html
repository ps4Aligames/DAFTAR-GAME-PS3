<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALI GAMES - Sales & Service PS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.header{position:relative;background:#000;overflow:hidden;min-height:620px}
/* BACKGROUND STIK GEDE SAMAR DI BELAKANG SALES SERVICE - JELAS NAMPAK */
.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0.58;z-index:1;filter:brightness(0.9) contrast(1.1)}
.bg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center 45%, transparent 15%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.85) 80%);z-index:2}
.overlay1{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.75) 85%);z-index:2}
.overlay2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.5) 100%);z-index:2}
.content{position:relative;z-index:3;padding:24px 20px 32px;max-width:760px}
.brand-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-title h1{font-size:27px;font-weight:900}
.badge-original{background:#fff;color:#000;font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:20px}
.brand-sub{color:#bbb;font-size:11px;letter-spacing:2px;margin-top:8px;font-weight:500;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.pill span{font-size:12px;font-weight:600;letter-spacing:.9px}
.big-title{margin-top:28px;font-weight:900;line-height:.88;letter-spacing:-1.5px;font-size:44px;text-shadow:0 2px 24px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,.8)}
.big-title .white{color:#fff;display:block}
.big-title .gray{color:#aaa}
.big-title .dark{color:#777}
.info{margin-top:30px;display:flex;gap:14px}
.icon-circle{width:40px;height:40px;border-radius:50%;background:rgba(26,26,26,.9);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-circle.green{background:rgba(19,42,19,.9);border-color:#1f4a1f}
.info-text .main{font-size:15px;font-weight:500;line-height:1.4;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.info-text .sub{font-size:12px;color:#888;margin-top:5px}
.wa-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;font-weight:800;font-size:15px;padding:15px 26px;border-radius:999px;margin-top:30px;cursor:pointer;border:0;box-shadow:0 8px 30px rgba(255,255,255,.2)}
.section{padding:26px 20px;background:#000;border-top:1px solid #111}
.koleksi-label{display:flex;align-items:center;gap:12px}
.line{width:32px;height:1.5px;background:#333}
.koleksi-label span{color:#666;font-size:11px;letter-spacing:3px;font-weight:600}
.section-title{font-size:30px;font-weight:800;margin-top:18px}
.section-title .muted{color:#555}
.chips{display:flex;gap:8px;overflow:auto;padding:18px 0;scrollbar-width:none}
.chip{background:#111;border:1px solid #222;color:#888;padding:8px 16px;border-radius:999px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:140px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card.on{border-color:#0070ff}
.cover{aspect-ratio:3/4;position:relative;overflow:hidden;background:#111}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge-terlaris{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:9px;font-weight:700;letter-spacing:.8px;padding:5px 10px;border-radius:20px;z-index:3}
.badge-num{position:absolute;top:8px;right:8px;background:#fff;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:3}
.foot{padding:10px 10px 12px}
.ft{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{font-size:11px;color:#555;margin-top:3px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-top:1px solid #1a1a1a;padding:14px 20px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px}
</style></head><body>
